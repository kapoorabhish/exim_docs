services:
  postgres:
    image: postgres:16-alpine
    container_name: exim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exim
      POSTGRES_PASSWORD: exim_dev_password
      POSTGRES_DB: exim_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: exim-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
